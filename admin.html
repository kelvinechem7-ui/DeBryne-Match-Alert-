<!DOCTYPE html><html lang="en">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>DeBryne Update - Admin</title><style>

select{

}

}

}

}

}

}

.error{

}

</style></head><body><header class="header"><h1>DeBryne Update</h1><p>Private Admin Panel</p></header><!-- LOGIN --><div id="loginPage"><main class="container"><div class="card"><h2>🔐 Admin Login</h2><p
style="
color:#64748b;
font-size:14px;
line-height:1.5;
">Sign in to manage DeBryne Update.

</p><label>Email</label>

<input
type="email"
id="email"
value="kelvinechem7@gmail.com"
autocomplete="email"

«»

<label>Password</label>

<input
type="password"
id="password"
placeholder="Enter your password"
autocomplete="current-password"

«»

<button
id="loginButton"
type="button">

LOGIN

</button><div
class="status"
id="loginStatus">Enter your password to continue.

</div></div></main></div><!-- ADMIN PANEL --><div id="adminPanel"><main class="container"><div class="card"><h2>👋 Admin Dashboard</h2><p
id="userEmail"
style="
color:#64748b;
font-size:13px;
"></p><button
class="logout"
id="logoutButton"
type="button">

LOG OUT

</button></div><!-- PUBLISH NEWS --><div class="card"><h2>📰 Publish News</h2><label>News Category</label>

<select id="category"><option value="Campus News">
Campus News
</option><option value="Academics">
Academics
</option><option value="Announcement">
Announcement
</option><option value="Sports">
Sports
</option><option value="Breaking News">
Breaking News
</option></select><label>News Title</label>

<input
type="text"
id="title"
placeholder="Enter news title"

«»

<label>News Content</label>

<textarea
id="content"
placeholder="Write your news here..."
></textarea><button
id="publishButton"
type="button">

PUBLISH NEWS

</button><div
class="status"
id="publishStatus">Ready to publish.

</div></div></main></div><script type="module">

/* =========================================
   FIREBASE IMPORTS
========================================= */

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";


import {
getAuth,
signInWithEmailAndPassword,
onAuthStateChanged,
signOut
}
from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


import {
getDatabase,
ref,
push,
set
}
from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";


/* =========================================
   FIREBASE CONFIG
========================================= */

const firebaseConfig = {

apiKey:
"AIzaSyBKHJEeLkkTRc_X6E_ZMaBqGyGkwO87-zo",

authDomain:
"debryne-update.firebaseapp.com",

databaseURL:
"https://debryne-update-default-rtdb.firebaseio.com",

projectId:
"debryne-update",

storageBucket:
"debryne-update.firebasestorage.app",

messagingSenderId:
"218054789442",

appId:
"1:218054789442:web:f891b9a9cd22e7938260db",

measurementId:
"G-1LNK265F45"

};


/* =========================================
   PUSH SERVER
========================================= */

const PUSH_SERVER_URL =

"https://script.google.com/macros/s/AKfycbwQVk4bcaaUuErxlsh8UZLyQA19FDpkgYQOp6WF-81vtOtdHC0CnclgIaJ-yULitmtJDA/exec";


/* =========================================
   INITIALIZE FIREBASE
========================================= */

let app;

let auth;

let db;

try{

app =
initializeApp(firebaseConfig);

auth =
getAuth(app);

db =
getDatabase(app);

console.log(
"Firebase Admin initialized."
);

}

catch(error){

console.error(
"Firebase initialization error:",
error
);

document.getElementById(
"loginStatus"
).textContent =
"Firebase error: " + error.message;

}


/* =========================================
   ELEMENTS
========================================= */

const loginPage =
document.getElementById(
"loginPage"
);

const adminPanel =
document.getElementById(
"adminPanel"
);

const loginButton =
document.getElementById(
"loginButton"
);

const logoutButton =
document.getElementById(
"logoutButton"
);

const publishButton =
document.getElementById(
"publishButton"
);

const loginStatus =
document.getElementById(
"loginStatus"
);

const publishStatus =
document.getElementById(
"publishStatus"
);


/* =========================================
   AUTH STATE
========================================= */

if(auth){

onAuthStateChanged(

auth,

function(user){

if(user){

loginPage.style.display =
"none";

adminPanel.style.display =
"block";

document.getElementById(
"userEmail"
).textContent =
"Signed in as: " +
(user.email || "Admin");

}

else{

loginPage.style.display =
"block";

adminPanel.style.display =
"none";

}

}

);

}


/* =========================================
   LOGIN
========================================= */

loginButton.addEventListener(

"click",

async function(){

const email =
document
.getElementById("email")
.value
.trim();

const password =
document
.getElementById("password")
.value;


if(!email || !password){

loginStatus.textContent =
"Please enter your email and password.";

loginStatus.className =
"status error";

return;

}


loginButton.disabled =
true;

loginButton.textContent =
"LOGGING IN...";

loginStatus.textContent =
"Signing in...";

loginStatus.className =
"status";


try{

await signInWithEmailAndPassword(

auth,

email,

password

);


loginStatus.textContent =
"✅ Login successful.";

loginStatus.className =
"status success";

}

catch(error){

console.error(error);

loginStatus.textContent =
"❌ Login failed: " +
error.message;

loginStatus.className =
"status error";

}

finally{

loginButton.disabled =
false;

loginButton.textContent =
"LOGIN";

}

}

);


/* =========================================
   LOGOUT
========================================= */

logoutButton.addEventListener(

"click",

async function(){

try{

await signOut(auth);

}

catch(error){

console.error(error);

}

}

);


/* =========================================
   SEND PUSH
========================================= */

async function sendPush(
title,
body
){

const response =
await fetch(

PUSH_SERVER_URL,

{

method:"POST",

headers:{
"Content-Type":
"text/plain;charset=utf-8"
},

body:JSON.stringify({

action:"send",

title:title,

body:body

})

}

);


const text =
await response.text();


console.log(
"Push response:",
text
);


if(!text){

throw new Error(
"Push server returned no response."
);

}


let result;

try{

result =
JSON.parse(text);

}

catch(error){

throw new Error(
"Push server returned an invalid response."
);

}


if(!result.success){

throw new Error(
result.error ||
"Notification could not be sent."
);

}


return result;

}


/* =========================================
   PUBLISH NEWS
========================================= */

publishButton.addEventListener(

"click",

async function(){

const user =
auth.currentUser;

const category =
document
.getElementById("category")
.value;

const title =
document
.getElementById("title")
.value
.trim();

const content =
document
.getElementById("content")
.value
.trim();


if(!user){

publishStatus.textContent =
"❌ Please log in first.";

publishStatus.className =
"status error";

return;

}


if(!title){

publishStatus.textContent =
"❌ Please enter a news title.";

publishStatus.className =
"status error";

return;

}


if(!content){

publishStatus.textContent =
"❌ Please enter news content.";

publishStatus.className =
"status error";

return;

}


publishButton.disabled =
true;

publishButton.textContent =
"PUBLISHING...";

publishStatus.textContent =
"Publishing news...";

publishStatus.className =
"status";


try{


/* SAVE NEWS */

const newsRef =
push(
ref(db,"news")
);


await set(

newsRef,

{

category:category,

title:title,

content:content,

author:user.email,

createdAt:Date.now()

}

);


publishStatus.textContent =
"News published. Sending notification...";


/* SEND NOTIFICATION */

try{

const result =
await sendPush(
title,
content
);


publishStatus.textContent =

"✅ News published and notification sent to " +
(result.successful || 0) +
" device(s).";

publishStatus.className =
"status success";

}

catch(notificationError){

console.error(
notificationError
);

publishStatus.textContent =

"✅ News published, but notification failed: " +
notificationError.message;

publishStatus.className =
"status error";

}


/* CLEAR FORM */

document.getElementById(
"title"
).value = "";

document.getElementById(
"content"
).value = "";

}

catch(error){

console.error(error);

publishStatus.textContent =
"❌ Publishing failed: " +
error.message;

publishStatus.className =
"status error";

}

finally{

publishButton.disabled =
false;

publishButton.textContent =
"PUBLISH NEWS";

}

}

);

</script></body>
     </html>
