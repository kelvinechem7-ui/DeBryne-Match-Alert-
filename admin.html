<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeBryne Update Admin</title><style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f6f8;
    color:#172033;
}

header{
    background:#111827;
    color:white;
    padding:20px;
}

.container{
    max-width:600px;
    margin:auto;
    padding:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:15px;
    margin-top:20px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

input{
    display:block;
    width:100%;
    padding:14px;
    margin-top:12px;
    border:1px solid #d1d5db;
    border-radius:9px;
    font-size:15px;
}

button{
    display:block;
    width:100%;
    padding:14px;
    margin-top:15px;
    border:0;
    border-radius:9px;
    background:#111827;
    color:white;
    font-size:15px;
    font-weight:bold;
}

.status{
    margin-top:15px;
    padding:12px;
    background:#f1f5f9;
    border-radius:9px;
    font-size:14px;
}

#dashboard{
    display:none;
}
</style></head><body><header>
    <h2>DeBryne Update</h2>
    <p>Private Admin Panel</p>
</header><div class="container"><div class="card" id="loginBox">

    <h2>🔐 Admin Login</h2>

    <input
        type="email"
        id="email"
        value="kelvinechem7@gmail.com"
        placeholder="Email"
    >

    <input
        type="password"
        id="password"
        placeholder="Enter password"
    >

    <button
        type="button"
        id="loginButton"
    >
        LOGIN
    </button>

    <div class="status" id="loginStatus">
        Enter your password to continue.
    </div>

</div>

<div class="card" id="dashboard">

    <h2>👋 Admin Dashboard</h2>

    <p id="userEmail"></p>

    <button
        type="button"
        id="logoutButton"
    >
        LOG OUT
    </button>

</div>

</div><script>
document.getElementById("loginButton").addEventListener("click",function(){

    var password =
        document.getElementById("password").value;

    var status =
        document.getElementById("loginStatus");

    if(!password){
        status.textContent =
            "Please enter your password.";
        return;
    }

    status.textContent =
        "Button is working. Firebase login will be added next.";

});
</script></body>
</html>
