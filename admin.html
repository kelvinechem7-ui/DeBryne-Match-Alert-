<title>DeBryne Update Admin</title><style>

body{

}

.card{
max-width:500px;

}

}

}

}

</style></head><body><div class="card" id="login"><h2>🔐 DeBryne Admin</h2><input
id="email"
type="email"
value="kelvinechem7@gmail.com"
placeholder="Email"

<input
id="password"
type="password"
placeholder="Password"

«»

<button
id="loginBtn"
type="button"

«»

LOGIN
</button>

<div
id="loginStatus"
class="status"
>
Enter your password.
</div></div><div
class="card"
id="admin"
><h2>👋 Admin Dashboard</h2><p id="account"></p><button
id="logoutBtn"
type="button"

«»

LOG OUT
</button>

<div class="status">
Firebase login is working.
</div></div><script
src="https://www.gstatic.com/firebasejs/12.17.1/firebase-app-compat.js">
</script><script
src="https://www.gstatic.com/firebasejs/12.17.1/firebase-auth-compat.js">
</script><script>

window.addEventListener(
"DOMContentLoaded",
function(){

const loginBtn =
document.getElementById(
"loginBtn"
);

const logoutBtn =
document.getElementById(
"logoutBtn"
);

const loginStatus =
document.getElementById(
"loginStatus"
);

const loginPage =
document.getElementById(
"login"
);

const adminPage =
document.getElementById(
"admin"
);

const account =
document.getElementById(
"account"
);


if(
!loginBtn ||
!logoutBtn ||
!loginStatus ||
!loginPage ||
!adminPage ||
!account
){

console.error(
"Admin HTML elements are missing."
);

return;

}


const firebaseConfig = {

apiKey:
"AIzaSyBKHJEeLkkTRc_X6E_ZMaBqGyGkwO87-zo",

authDomain:
"debryne-update.firebaseapp.com",

databaseURL:
"https://debryne-update-default-rtdb.firebaseio.com",

projectId:
"debryne-update",

storageBucket:
"debryne-update.firebasestorage.app",

messagingSenderId:
"218054789442",

appId:
"1:218054789442:web:f891b9a9cd22e7938260db"

};


try{


firebase.initializeApp(
firebaseConfig
);


const auth =
firebase.auth();


/* LOGIN */

loginBtn.onclick =
async function(){

const email =
document.getElementById(
"email"
).value.trim();

const password =
document.getElementById(
"password"
).value;


if(
!email ||
!password
){

loginStatus.textContent =
"Please enter your email and password.";

return;

}


loginBtn.disabled =
true;

loginBtn.textContent =
"LOGGING IN...";

loginStatus.textContent =
"Signing in...";


try{

await auth.signInWithEmailAndPassword(
email,
password
);

loginStatus.textContent =
"✅ Login successful.";

}

catch(error){

console.error(error);

loginStatus.textContent =
"❌ Login failed: " +
error.message;

loginBtn.disabled =
false;

loginBtn.textContent =
"LOGIN";

}

};


/* AUTH STATE */

auth.onAuthStateChanged(
function(user){

if(user){

loginPage.style.display =
"none";

adminPage.style.display =
"block";

account.textContent =
"Signed in as: " +
user.email;

}

else{

loginPage.style.display =
"block";

adminPage.style.display =
"none";

loginBtn.disabled =
false;

loginBtn.textContent =
"LOGIN";

}

}
);


/* LOGOUT */

logoutBtn.onclick =
async function(){

try{

await auth.signOut();

}

catch(error){

console.error(error);

}

};


}

catch(error){

console.error(
"Firebase initialization error:",
error
);

loginStatus.textContent =
"Firebase error: " +
error.message;

}

});

</script></body></html>
