<!DOCTYPE html><html lang="en">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>DeBryne Update Admin</title><style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f6f8;
color:#172033;
}

header{
background:#111827;
color:white;
padding:20px;
}

header h1{
margin:0;
font-size:22px;
}

header p{
margin:6px 0 0;
font-size:13px;
color:#cbd5e1;
}

.container{
max-width:650px;
margin:auto;
padding:20px;
}

.card{
background:white;
padding:20px;
border-radius:15px;
margin-top:20px;
box-shadow:0 3px 12px rgba(0,0,0,.08);
}

input,
textarea,
select{
display:block;
width:100%;
padding:14px;
margin-top:10px;
border:1px solid #d1d5db;
border-radius:9px;
font-family:Arial,sans-serif;
font-size:15px;
}

textarea{
min-height:140px;
resize:vertical;
}

button{
display:block;
width:100%;
padding:15px;
margin-top:16px;
background:#111827;
color:white;
border:none;
border-radius:9px;
font-size:15px;
font-weight:bold;
cursor:pointer;
}

button:disabled{
opacity:.6;
}

.logout{
background:#dc2626;
}

.status{
margin-top:15px;
padding:12px;
background:#f1f5f9;
border-radius:9px;
font-size:14px;
line-height:1.5;
word-break:break-word;
}

.success{
background:#ecfdf5;
color:#166534;
}

.error{
background:#fef2f2;
color:#991b1b;
}

#adminPanel{
display:none;
}

</style></head><body><header><h1>DeBryne Update</h1><p>Private Admin Panel</p></header><div class="container"><!-- LOGIN --><div class="card" id="loginPage"><h2>🔐 Admin Login</h2><p>
Sign in to manage DeBryne Update.
</p><input
id="email"
type="email"
value="kelvinechem7@gmail.com"
placeholder="Email"

«»

<input
id="password"
type="password"
placeholder="Enter your password"

«»

<button
id="loginButton"
type="button"

«»

LOGIN
</button>

<div
id="loginStatus"
class="status"
>
Enter your password to continue.
</div></div><!-- ADMIN PANEL --><div
id="adminPanel"
><div class="card"><h2>👋 Admin Dashboard</h2><p id="userEmail"></p><button
id="logoutButton"
type="button"
class="logout"

«»

LOG OUT
</button>

</div><div class="card"><h2>📰 Publish News</h2><label>Category</label>

<select id="category"><option value="Campus News">
Campus News
</option><option value="Academics">
Academics
</option><option value="Announcement">
Announcement
</option><option value="Sports">
Sports
</option><option value="Breaking News">
Breaking News
</option></select><label>News Title</label>

<input
id="title"
type="text"
placeholder="Enter news title"

«»

<label>News Content</label>

<textarea
id="content"
placeholder="Write your news here..."
></textarea><button
id="publishButton"
type="button"

«»

PUBLISH NEWS
</button>

<div
id="publishStatus"
class="status"
>
Ready to publish.
</div></div></div></div><!-- FIREBASE --><script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-database-compat.js"></script><script>

const firebaseConfig = {

apiKey:
"AIzaSyBKHJEeLkkTRc_X6E_ZMaBqGyGkwO87-zo",

authDomain:
"debryne-update.firebaseapp.com",

databaseURL:
"https://debryne-update-default-rtdb.firebaseio.com",

projectId:
"debryne-update",

storageBucket:
"debryne-update.firebasestorage.app",

messagingSenderId:
"218054789442",

appId:
"1:218054789442:web:f891b9a9cd22e7938260db"

};


let auth;
let database;


/* START FIREBASE */

try{

firebase.initializeApp(firebaseConfig);

auth =
firebase.auth();

database =
firebase.database();

}

catch(error){

console.error(error);

document.getElementById(
"loginStatus"
).textContent =
"Firebase error: " +
error.message;

document.getElementById(
"loginStatus"
).className =
"status error";

}


/* LOGIN */

document.getElementById(
"loginButton"
).onclick = async function(){

const email =
document.getElementById(
"email"
).value.trim();

const password =
document.getElementById(
"password"
).value;

const status =
document.getElementById(
"loginStatus"
);

const button =
document.getElementById(
"loginButton"
);


if(!password){

status.textContent =
"Please enter your password.";

status.className =
"status error";

return;

}


button.disabled =
true;

button.textContent =
"LOGGING IN...";

status.textContent =
"Signing in...";

status.className =
"status";


try{

await auth.signInWithEmailAndPassword(
email,
password
);

}

catch(error){

console.error(error);

status.textContent =
"❌ Login failed: " +
error.message;

status.className =
"status error";

button.disabled =
false;

button.textContent =
"LOGIN";

}

};


/* AUTH STATE */

auth.onAuthStateChanged(
function(user){

const loginPage =
document.getElementById(
"loginPage"
);

const adminPanel =
document.getElementById(
"adminPanel"
);


if(user){

loginPage.style.display =
"none";

adminPanel.style.display =
"block";

document.getElementById(
"userEmail"
).textContent =
"Signed in as: " +
user.email;

}

else{

loginPage.style.display =
"block";

adminPanel.style.display =
"none";

}

});


/* LOGOUT */

document.getElementById(
"logoutButton"
).onclick = async function(){

await auth.signOut();

};


/* PUBLISH NEWS */

document.getElementById(
"publishButton"
).onclick = async function(){

const user =
auth.currentUser;

const category =
document.getElementById(
"category"
).value;

const title =
document.getElementById(
"title"
).value.trim();

const content =
document.getElementById(
"content"
).value.trim();

const status =
document.getElementById(
"publishStatus"
);

const button =
document.getElementById(
"publishButton"
);


if(!user){

status.textContent =
"Please login first.";

status.className =
"status error";

return;

}


if(!title || !content){

status.textContent =
"Please enter the title and content.";

status.className =
"status error";

return;

}


button.disabled =
true;

button.textContent =
"PUBLISHING...";

status.textContent =
"Publishing news...";

status.className =
"status";


try{

const news =
database.ref("news").push();

await news.set({

category:category,

title:title,

content:content,

author:user.email,

createdAt:Date.now()

});


status.textContent =
"✅ News published successfully.";

status.className =
"status success";

document.getElementById(
"title"
).value = "";

document.getElementById(
"content"
).value = "";

}

catch(error){

console.error(error);

status.textContent =
"❌ Publishing failed: " +
error.message;

status.className =
"status error";

}


button.disabled =
false;

button.textContent =
"PUBLISH NEWS";

};

</script></body>
                                                                 </html>
