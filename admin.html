<!DOCTYPE html><html lang="en">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>DeBryne Update - Admin</title><style>

*{

padding:0;
}

color:#172033;

.header{

color:white;
padding:20px;
}

.header h1{

}

.header p{
font-size:13px;
color:#cbd5e1;
margin-top:5px;
}

.container{
max-width:700px;
margin:auto;
padding:18px;
}

.card{
background:white;
padding:20px;
border-radius:15px;
margin-bottom:18px;
box-shadow:0 3px 12px rgba(0,0,0,.06);
}

h2{

}

label{
display:block;

}

select{

}

}

}

</style></head><body><header class="header"><h1>DeBryne Update</h1><p>Private Admin Panel</p></header><!-- LOGIN --><div id="loginPage"><div class="container"><div class="card"><h2>🔐 Admin Login</h2><p style="color:#64748b;font-size:14px;">
Sign in to manage DeBryne Update.
</p><label>Email</label>

<input
id="email"
type="email"
value="kelvinechem7@gmail.com"

«»

<label>Password</label>

<input
id="password"
type="password"
placeholder="Enter password"

«»

<button
id="loginButton"
type="button">

LOGIN

</button><div
id="loginStatus"
class="status">Enter your password to continue.

</div></div></div></div><!-- ADMIN --><div id="adminPanel"><div class="container"><div class="card"><h2>👋 Admin Dashboard</h2><p
id="userEmail"
style="color:#64748b;font-size:13px;">
</p><button
id="logoutButton"
type="button"
class="logout">

LOG OUT

</button></div><div class="card"><h2>📰 Publish News</h2><label>News Category</label>

<select id="category"><option>Campus News</option>
<option>Academics</option>
<option>Announcement</option>
<option>Sports</option>
<option>Breaking News</option></select><label>News Title</label>

<input
id="title"
type="text"
placeholder="Enter news title"

«»

<label>News Content</label>

<textarea
id="content"
placeholder="Write your news here..."
></textarea><button
id="publishButton"
type="button">

PUBLISH NEWS

</button><div
id="publishStatus"
class="status">Ready to publish.

</div></div></div></div><!-- FIREBASE COMPAT --><script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-database-compat.js"></script><script>

/* =========================================
   FIREBASE
========================================= */

const firebaseConfig = {

apiKey:
"AIzaSyBKHJEeLkkTRc_X6E_ZMaBqGyGkwO87-zo",

authDomain:
"debryne-update.firebaseapp.com",

databaseURL:
"https://debryne-update-default-rtdb.firebaseio.com",

projectId:
"debryne-update",

storageBucket:
"debryne-update.firebasestorage.app",

messagingSenderId:
"218054789442",

appId:
"1:218054789442:web:f891b9a9cd22e7938260db"

};


/* START FIREBASE */

firebase.initializeApp(firebaseConfig);

const auth =
firebase.auth();

const db =
firebase.database();


/* =========================================
   ELEMENTS
========================================= */

const loginButton =
document.getElementById("loginButton");

const logoutButton =
document.getElementById("logoutButton");

const publishButton =
document.getElementById("publishButton");

const loginStatus =
document.getElementById("loginStatus");

const publishStatus =
document.getElementById("publishStatus");


/* =========================================
   LOGIN
========================================= */

loginButton.onclick = async function(){

const email =
document.getElementById("email").value.trim();

const password =
document.getElementById("password").value;


if(!email || !password){

loginStatus.textContent =
"Please enter your email and password.";

loginStatus.className =
"status error";

return;

}


loginButton.disabled = true;

loginButton.textContent =
"LOGGING IN...";


try{

await auth.signInWithEmailAndPassword(
email,
password
);

loginStatus.textContent =
"✅ Login successful.";

loginStatus.className =
"status success";

}

catch(error){

console.error(error);

loginStatus.textContent =
"❌ " + error.message;

loginStatus.className =
"status error";

}

finally{

loginButton.disabled = false;

loginButton.textContent =
"LOGIN";

}

};


/* =========================================
   AUTH STATE
========================================= */

auth.onAuthStateChanged(function(user){

if(user){

document.getElementById(
"loginPage"
).style.display = "none";

document.getElementById(
"adminPanel"
).style.display = "block";

document.getElementById(
"userEmail"
).textContent =
"Signed in as: " + user.email;

}

else{

document.getElementById(
"loginPage"
).style.display = "block";

document.getElementById(
"adminPanel"
).style.display = "none";

}

});


/* =========================================
   LOGOUT
========================================= */

logoutButton.onclick = async function(){

try{

await auth.signOut();

}

catch(error){

console.error(error);

}

};


/* =========================================
   PUSH SERVER
========================================= */

const PUSH_SERVER_URL =
"https://script.google.com/macros/s/AKfycbwQVk4bcaaUuErxlsh8UZLyQA19FDpkgYQOp6WF-81vtOtdHC0CnclgIaJ-yULitmtJDA/exec";


/* =========================================
   SEND NOTIFICATION
========================================= */

async function sendNotification(title,body){

const response =
await fetch(
PUSH_SERVER_URL,
{
method:"POST",
headers:{
"Content-Type":
"text/plain;charset=utf-8"
},
body:JSON.stringify({
action:"send",
title:title,
body:body
})
}
);

const text =
await response.text();

console.log(text);

let result;

try{

result = JSON.parse(text);

}

catch(e){

throw new Error(
"Push server returned an invalid response."
);

}

if(!result.success){

throw new Error(
result.error ||
"Notification failed."
);

}

return result;

}


/* =========================================
   PUBLISH NEWS
========================================= */

publishButton.onclick = async function(){

const user =
auth.currentUser;

if(!user){

publishStatus.textContent =
"❌ Please log in first.";

publishStatus.className =
"status error";

return;

}


const category =
document.getElementById(
"category"
).value;

const title =
document.getElementById(
"title"
).value.trim();

const content =
document.getElementById(
"content"
).value.trim();


if(!title || !content){

publishStatus.textContent =
"❌ Enter both title and content.";

publishStatus.className =
"status error";

return;

}


publishButton.disabled = true;

publishButton.textContent =
"PUBLISHING...";

publishStatus.textContent =
"Publishing news...";

publishStatus.className =
"status";


try{

/* SAVE NEWS */

const newsRef =
db.ref("news").push();

await newsRef.set({

category:category,

title:title,

content:content,

author:user.email,

createdAt:Date.now()

});


/* SEND NOTIFICATION */

publishStatus.textContent =
"News published. Sending notification...";


try{

const result =
await sendNotification(
title,
content
);

publishStatus.textContent =
"✅ News published and notification sent to " +
(result.successful || 0) +
" device(s).";

publishStatus.className =
"status success";

}

catch(error){

publishStatus.textContent =
"✅ News published, but notification failed: " +
error.message;

publishStatus.className =
"status error";

}


/* CLEAR */

document.getElementById(
"title"
).value = "";

document.getElementById(
"content"
).value = "";

}

catch(error){

console.error(error);

publishStatus.textContent =
"❌ Publishing failed: " +
error.message;

publishStatus.className =
"status error";

}

finally{

publishButton.disabled = false;

publishButton.textContent =
"PUBLISH NEWS";

}

};

</script></body>
</html>
