<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DeBryne Update Admin</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    color: #172033;
}

header {
    background: #111827;
    color: white;
    padding: 20px;
}

header h1 {
    margin: 0;
    font-size: 23px;
}

header p {
    margin: 6px 0 0;
    color: #cbd5e1;
    font-size: 14px;
}

.container {
    max-width: 650px;
    margin: auto;
    padding: 20px;
}

.card {
    background: white;
    padding: 22px;
    border-radius: 15px;
    margin-top: 20px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

input,
textarea,
select {
    width: 100%;
    display: block;
    padding: 14px;
    margin-top: 12px;
    border: 1px solid #d1d5db;
    border-radius: 9px;
    font-size: 16px;
    font-family: Arial, sans-serif;
}

textarea {
    min-height: 140px;
    resize: vertical;
}

button {
    width: 100%;
    display: block;
    padding: 15px;
    margin-top: 16px;
    border: none;
    border-radius: 9px;
    background: #111827;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:active {
    transform: scale(0.99);
}

button:disabled {
    opacity: 0.6;
}

.logout {
    background: #dc2626;
}

.status {
    margin-top: 15px;
    padding: 12px;
    border-radius: 9px;
    background: #f1f5f9;
    font-size: 14px;
    line-height: 1.5;
}

.success {
    background: #ecfdf5;
    color: #166534;
}

.error {
    background: #fef2f2;
    color: #991b1b;
}

#dashboard {
    display: none;
}

#publishCard {
    display: none;
}
</style>
</head>

<body>

<header>
    <h1>DeBryne Update</h1>
    <p>Private Admin Panel</p>
</header>

<div class="container">

    <!-- LOGIN -->
    <div class="card" id="loginBox">

        <h2>🔐 Admin Login</h2>

        <p>Sign in to manage DeBryne Update.</p>

        <input
            id="email"
            type="email"
            value="kelvinechem7@gmail.com"
            placeholder="Email"
        >

        <input
            id="password"
            type="password"
            placeholder="Enter your password"
        >

        <button
            id="loginButton"
            type="button"
        >LOGIN</button>

        <div
            id="loginStatus"
            class="status"
        >Enter your password to continue.</div>

    </div>


    <!-- DASHBOARD -->
    <div
        class="card"
        id="dashboard"
    >

        <h2>👋 Admin Dashboard</h2>

        <p id="userEmail"></p>

        <button
            id="logoutButton"
            type="button"
            class="logout"
        >LOG OUT</button>

    </div>


    <!-- PUBLISH NEWS -->
    <div
        class="card"
        id="publishCard"
    >

        <h2>📰 Publish News</h2>

        <select id="category">
            <option value="Campus News">Campus News</option>
            <option value="Academics">Academics</option>
            <option value="Announcement">Announcement</option>
            <option value="Sports">Sports</option>
            <option value="Breaking News">Breaking News</option>
        </select>

        <input
            id="title"
            type="text"
            placeholder="Enter news title"
        >

        <textarea
            id="content"
            placeholder="Write your news here..."
        ></textarea>

        <button
            id="publishButton"
            type="button"
        >PUBLISH NEWS</button>

        <div
            id="publishStatus"
            class="status"
        >Ready to publish.</div>

    </div>

</div>


<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-database-compat.js"></script>

<script>

const firebaseConfig = {
    apiKey: "AIzaSyBKHJEeLkkTRc_X6E_ZMaBqGyGkwO87-zo",
    authDomain: "debryne-update.firebaseapp.com",
    databaseURL: "https://debryne-update-default-rtdb.firebaseio.com",
    projectId: "debryne-update",
    storageBucket: "debryne-update.firebasestorage.app",
    messagingSenderId: "218054789442",
    appId: "1:218054789442:web:f891b9a9cd22e7938260db"
};

let auth = null;
let database = null;

try {

    firebase.initializeApp(firebaseConfig);

    auth = firebase.auth();
    database = firebase.database();

} catch (error) {

    console.error(error);

    document.getElementById("loginStatus").textContent =
        "Firebase error: " + error.message;

    document.getElementById("loginStatus").className =
        "status error";
}


/* LOGIN */

document.getElementById("loginButton").addEventListener("click", async function() {

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const status =
        document.getElementById("loginStatus");

    const button =
        document.getElementById("loginButton");

    if (!email) {
        status.textContent = "Please enter your email.";
        status.className = "status error";
        return;
    }

    if (!password) {
        status.textContent = "Please enter your password.";
        status.className = "status error";
        return;
    }

    if (!auth) {
        status.textContent = "Firebase is not available.";
        status.className = "status error";
        return;
    }

    button.disabled = true;
    button.textContent = "LOGGING IN...";
    status.textContent = "Signing in...";
    status.className = "status";

    try {

        await auth.signInWithEmailAndPassword(
            email,
            password
        );

        status.textContent = "Login successful.";
        status.className = "status success";

    } catch (error) {

        console.error(error);

        status.textContent =
            "Login failed: " + error.message;

        status.className = "status error";

        button.disabled = false;
        button.textContent = "LOGIN";
    }

});


/* AUTH STATE */

if (auth) {

    auth.onAuthStateChanged(function(user) {

        const loginBox =
            document.getElementById("loginBox");

        const dashboard =
            document.getElementById("dashboard");

        const publishCard =
            document.getElementById("publishCard");

        const userEmail =
            document.getElementById("userEmail");

        if (user) {

            loginBox.style.display = "none";
            dashboard.style.display = "block";
            publishCard.style.display = "block";

            userEmail.textContent =
                "Signed in as: " + user.email;

        } else {

            loginBox.style.display = "block";
            dashboard.style.display = "none";
            publishCard.style.display = "none";
        }

    });

}


/* LOGOUT */

document.getElementById("logoutButton").addEventListener("click", async function() {

    if (auth) {
        await auth.signOut();
    }

});


/* PUBLISH NEWS */

document.getElementById("publishButton").addEventListener("click", async function() {

    const user = auth ? auth.currentUser : null;

    const category =
        document.getElementById("category").value;

    const title =
        document.getElementById("title").value.trim();

    const content =
        document.getElementById("content").value.trim();

    const status =
        document.getElementById("publishStatus");

    const button =
        document.getElementById("publishButton");

    if (!user) {

        status.textContent = "Please login first.";
        status.className = "status error";
        return;
    }

    if (!title || !content) {

        status.textContent =
            "Please enter the title and content.";

        status.className = "status error";
        return;
    }

    button.disabled = true;
    button.textContent = "PUBLISHING...";
    status.textContent = "Publishing...";
    status.className = "status";

    try {

        const news =
            database.ref("news").push();

        await news.set({
            category: category,
            title: title,
            content: content,
            author: user.email,
            createdAt: Date.now()
        });

        status.textContent =
            "✅ News published successfully.";

        status.className = "status success";

        document.getElementById("title").value = "";
        document.getElementById("content").value = "";

    } catch (error) {

        console.error(error);

        status.textContent =
            "❌ Publishing failed: " + error.message;

        status.className = "status error";

    }

    button.disabled = false;
    button.textContent = "PUBLISH NEWS";

});

</script>

</body>
</html>
