<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Debryne Match Alert - Live</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #080b10;
  color: white;
}

.container {
  max-width: 500px;
  margin: auto;
  padding: 25px 15px;
}

.brand {
  text-align: center;
  color: #f5c542;
  font-weight: bold;
  letter-spacing: 2px;
  margin-bottom: 20px;
}

.live {
  text-align: center;
  color: #72e28b;
  font-weight: bold;
  margin-bottom: 15px;
}

.card {
  background: #151b23;
  border: 1px solid #29323d;
  border-radius: 20px;
  padding: 25px 18px;
}

.competition {
  text-align: center;
  color: #9da7b3;
  font-size: 13px;
  letter-spacing: 1px;
}

h1 {
  text-align: center;
  font-size: 22px;
  margin: 10px 0 30px;
}

.teams {
  display: flex;
  align-items: center;
  justify-content: space-between;
  text-align: center;
}

.team {
  width: 35%;
  font-weight: bold;
  font-size: 15px;
}

.score {
  font-size: 38px;
  font-weight: 900;
  white-space: nowrap;
}

.status {
  text-align: center;
  margin: 25px 0 15px;
  font-weight: bold;
  color: #72e28b;
}

.timer {
  text-align: center;
  font-size: 30px;
  font-weight: bold;
  color: #f5c542;
  margin: 15px 0;
}

.details {
  text-align: center;
  color: #b8c0c9;
  line-height: 1.8;
  font-size: 14px;
}

.alert {
  margin-top: 20px;
  padding: 15px;
  border-radius: 12px;
  background: #202934;
  text-align: center;
}

.connection {
  text-align: center;
  margin-top: 15px;
  font-size: 12px;
  color: #72e28b;
}

.footer {
  text-align: center;
  margin-top: 25px;
  color: #68727e;
  font-size: 12px;
}

</style>

</head>

<body>

<div class="container">

  <div class="brand">
    DEBRYNE UPDATE
  </div>

  <div class="live">
    🔴 LIVE MATCH CENTRE
  </div>

  <div class="card">

    <div class="competition">
      COMPUTER SCIENCE
    </div>

    <h1>
      🏆 SEND-FORTH MATCH
    </h1>

    <div class="teams">

      <div class="team">
        ND1 + HND1
      </div>

      <div class="score">
        <span id="homeScore">0</span>
        —
        <span id="awayScore">0</span>
      </div>

      <div class="team">
        ND2 + HND2
      </div>

    </div>

    <div class="status" id="status">
      🟢 MATCH NOT STARTED
    </div>

    <div class="timer" id="timer">
      ⏱️ 00:00
    </div>

    <div class="details">
      📅 Sunday, August 9, 2026<br>
      ⏰ 3:00 PM<br>
      📍 School Multipurpose Field
    </div>

    <div class="alert" id="alert">
      🔔 Waiting for match updates...
    </div>

  </div>

  <div class="connection" id="connection">
    🟡 CONNECTING TO LIVE DATABASE...
  </div>

  <div class="footer">
    Powered by Debryne Update
  </div>

</div>


<script type="module">

/* =========================
   FIREBASE
========================= */

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

import {
  getDatabase,
  ref,
  onValue
}
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";


/* =========================
   SAME FIREBASE PROJECT
   AS CONTROL PANEL
========================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyDiv2PjGsMCOpmTqBKzbydWUsFOP36fFtM",

  authDomain:
    "debryne-match-alert-a2d51.firebaseapp.com",

  databaseURL:
    "https://debryne-match-alert-a2d51-default-rtdb.firebaseio.com",

  projectId:
    "debryne-match-alert-a2d51",

  storageBucket:
    "debryne-match-alert-a2d51.firebasestorage.app",

  messagingSenderId:
    "967179671646",

  appId:
    "1:967179671646:web:0cbf28b0f57a146ca2bccf",

  measurementId:
    "G-R2TYPHXC37"
};


/* =========================
   INITIALIZE
========================= */

const app =
  initializeApp(firebaseConfig);

const db =
  getDatabase(app);

const matchRef =
  ref(db, "match");


/* =========================
   ELEMENTS
========================= */

const homeScore =
  document.getElementById("homeScore");

const awayScore =
  document.getElementById("awayScore");

const status =
  document.getElementById("status");

const timer =
  document.getElementById("timer");

const alertBox =
  document.getElementById("alert");

const connection =
  document.getElementById("connection");


/* =========================
   TIMER
========================= */

let timerSeconds = 0;

let timerRunning = false;

let timerInterval = null;


function formatTime(seconds) {

  seconds =
    Math.max(0, Math.floor(seconds));

  const minutes =
    Math.floor(seconds / 60);

  const secs =
    seconds % 60;

  return (
    String(minutes).padStart(2, "0")
    +
    ":"
    +
    String(secs).padStart(2, "0")
  );

}


function updateTimer() {

  timer.textContent =
    "⏱️ " +
    formatTime(timerSeconds);

}


function startViewerTimer() {

  if (timerInterval !== null) {
    return;
  }

  timerInterval =
    setInterval(() => {

      if (timerRunning) {

        timerSeconds++;

        updateTimer();

      }

    }, 1000);

}


/* =========================
   LIVE FIREBASE LISTENER
========================= */

onValue(
  matchRef,

  (snapshot) => {

    const data =
      snapshot.val();

    connection.textContent =
      "🟢 LIVE DATABASE CONNECTED";

    if (!data) {

      homeScore.textContent = "0";

      awayScore.textContent = "0";

      status.textContent =
        "🟢 MATCH NOT STARTED";

      alertBox.textContent =
        "🔔 Waiting for match updates...";

      timerSeconds = 0;

      timerRunning = false;

      updateTimer();

      return;
    }


    /* SCORE */

    homeScore.textContent =
      Number(data.homeScore || 0);

    awayScore.textContent =
      Number(data.awayScore || 0);


    /* STATUS */

    status.textContent =
      data.status ||
      "🟢 MATCH NOT STARTED";


    /* ALERT */

    alertBox.textContent =
      data.alert ||
      "🔔 Waiting for match updates...";


    /*
      Load the Firebase timer.
      The viewer then continues counting
      locally while the match is live.
    */

    timerSeconds =
      Number(data.timerSeconds || 0);

    timerRunning =
      data.timerRunning === true;

    updateTimer();

    startViewerTimer();

  },

  (error) => {

    console.error(
      "Firebase Viewer Error:",
      error
    );

    connection.textContent =
      "🔴 DATABASE CONNECTION ERROR";

  }
);


/* INITIAL */

updateTimer();

startViewerTimer();

</script>

</body>
  </html>
