<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DeBryne Match Alert - Control</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #080b10;
  color: white;
}

.container {
  max-width: 500px;
  margin: auto;
  padding: 25px 15px 40px;
}

.card {
  background: #151b23;
  border: 1px solid #29323d;
  border-radius: 20px;
  padding: 25px 18px;
}

.brand {
  text-align: center;
  color: #f5c542;
  font-weight: bold;
  letter-spacing: 2px;
  margin-bottom: 20px;
}

.login {
  margin-top: 50px;
}

h1 {
  text-align: center;
  font-size: 22px;
  margin: 10px 0 30px;
}

input {
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  border: 1px solid #394451;
  border-radius: 10px;
  background: #0d1218;
  color: white;
  font-size: 15px;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  border: none;
  border-radius: 12px;
  background: #f5c542;
  color: #111;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

button:active {
  transform: scale(0.98);
}

button.dark {
  background: #29323d;
  color: white;
}

button.red {
  background: #a83232;
  color: white;
}

.hidden {
  display: none;
}

.error {
  text-align: center;
  color: #ff7070;
  font-size: 13px;
  margin-top: 12px;
}

.competition {
  text-align: center;
  color: #9da7b3;
  font-size: 13px;
  letter-spacing: 1px;
}

.teams {
  display: flex;
  align-items: center;
  justify-content: space-between;
  text-align: center;
}

.team {
  width: 35%;
  font-weight: bold;
  font-size: 15px;
}

.score {
  font-size: 38px;
  font-weight: 900;
  white-space: nowrap;
}

.status {
  text-align: center;
  margin: 25px 0 10px;
  color: #72e28b;
  font-weight: bold;
}

.timer {
  text-align: center;
  font-size: 32px;
  font-weight: bold;
  margin: 10px 0 20px;
  color: #f5c542;
}

.details {
  text-align: center;
  color: #b8c0c9;
  line-height: 1.8;
  font-size: 14px;
}

.alert {
  margin-top: 20px;
  padding: 15px;
  border-radius: 12px;
  background: #202934;
  text-align: center;
}

.control {
  margin-top: 25px;
  border-top: 1px solid #29323d;
  padding-top: 20px;
}

.control h2 {
  text-align: center;
  font-size: 16px;
}

.connection {
  text-align: center;
  font-size: 12px;
  margin-top: 15px;
  color: #72e28b;
}

.logout {
  background: #29323d;
  color: white;
}
</style>
</head>

<body>

<div class="container">

<!-- LOGIN -->

<div id="loginScreen" class="card login">

  <div class="brand">
    DEBRYNE UPDATE
  </div>

  <h1>🔐 CONTROL PANEL LOGIN</h1>

  <input
    type="email"
    id="email"
    value="kelvinechem7@gmail.com"
    placeholder="Email"
    autocomplete="email"
  >

  <input
    type="password"
    id="password"
    placeholder="Password"
    autocomplete="current-password"
  >

  <button id="loginBtn">
    🔐 LOGIN
  </button>

  <div id="loginError" class="error"></div>

</div>


<!-- CONTROL PANEL -->

<div id="controlPanel" class="card hidden">

  <div class="brand">
    DEBRYNE UPDATE
  </div>

  <div class="competition">
    COMPUTER SCIENCE
  </div>

  <h1>
    🏆 SEND-FORTH MATCH
  </h1>

  <div class="teams">

    <div class="team">
      ND1 + HND1
    </div>

    <div class="score">
      <span id="homeScore">0</span>
      —
      <span id="awayScore">0</span>
    </div>

    <div class="team">
      ND2 + HND2
    </div>

  </div>

  <div class="status" id="status">
    🟢 MATCH NOT STARTED
  </div>

  <div class="timer" id="timer">
    ⏱️ 00:00
  </div>

  <div class="details">
    📅 Sunday, August 9, 2026<br>
    ⏰ 3:00 PM<br>
    📍 School Multipurpose Field
  </div>

  <div class="alert" id="alert">
    🎛️ Control panel ready.
  </div>

  <div class="control">

    <h2>🎛️ MATCH CONTROL</h2>

    <button id="startBtn">
      🟢 START MATCH
    </button>

    <button id="homeGoalBtn">
      ⚽ GOAL — ND1 + HND1
    </button>

    <button id="awayGoalBtn">
      ⚽ GOAL — ND2 + HND2
    </button>

    <button class="dark" id="halfBtn">
      ⏸️ HALF TIME
    </button>

    <button class="dark" id="resumeBtn">
      ▶️ RESUME MATCH
    </button>

    <button class="dark" id="fullBtn">
      🏁 FULL TIME
    </button>

    <button class="red" id="resetBtn">
      🔄 RESET MATCH
    </button>

  </div>

  <div class="connection" id="connection">
    🟡 CONNECTING TO FIREBASE...
  </div>

  <button class="logout" id="logoutBtn">
    🚪 LOG OUT
  </button>

</div>

</div>


<script type="module">

/* =========================
   FIREBASE IMPORTS
========================= */

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

import {
  getDatabase,
  ref,
  set,
  onValue
}
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
}
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyDiv2PjGsMCOpmTqBKzbydWUsFOP36fFtM",

  authDomain:
    "debryne-match-alert-a2d51.firebaseapp.com",

  databaseURL:
    "https://debryne-match-alert-a2d51-default-rtdb.firebaseio.com",

  projectId:
    "debryne-match-alert-a2d51",

  storageBucket:
    "debryne-match-alert-a2d51.firebasestorage.app",

  messagingSenderId:
    "967179671646",

  appId:
    "1:967179671646:web:0cbf28b0f57a146ca2bccf",

  measurementId:
    "G-R2TYPHXC37"
};


/* =========================
   INITIALIZE FIREBASE
========================= */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const database = getDatabase(app);

const matchRef = ref(database, "match");


/* =========================
   ELEMENTS
========================= */

const loginScreen =
  document.getElementById("loginScreen");

const controlPanel =
  document.getElementById("controlPanel");

const loginError =
  document.getElementById("loginError");

const connection =
  document.getElementById("connection");

const homeScoreDisplay =
  document.getElementById("homeScore");

const awayScoreDisplay =
  document.getElementById("awayScore");

const statusDisplay =
  document.getElementById("status");

const timerDisplay =
  document.getElementById("timer");

const alertDisplay =
  document.getElementById("alert");


/* =========================
   LOCAL MATCH STATE
========================= */

let homeScore = 0;

let awayScore = 0;

let timerSeconds = 0;

let timerRunning = false;

let timerInterval = null;


/* =========================
   FORMAT TIMER
========================= */

function formatTime(seconds) {

  seconds =
    Math.max(0, Math.floor(seconds));

  const minutes =
    Math.floor(seconds / 60);

  const secs =
    seconds % 60;

  return (
    String(minutes).padStart(2, "0")
    +
    ":"
    +
    String(secs).padStart(2, "0")
  );
}


/* =========================
   UPDATE TIMER
========================= */

function updateTimer() {

  timerDisplay.textContent =
    "⏱️ " +
    formatTime(timerSeconds);

}


/* =========================
   START LOCAL TIMER
========================= */

function startLocalTimer() {

  if (timerInterval !== null) {
    return;
  }

  timerInterval =
    setInterval(() => {

      if (timerRunning) {

        timerSeconds++;

        updateTimer();

      }

    }, 1000);

}


/* =========================
   STOP LOCAL TIMER
========================= */

function stopLocalTimer() {

  if (timerInterval !== null) {

    clearInterval(timerInterval);

    timerInterval = null;

  }

}


/* =========================
   SAVE MATCH TO FIREBASE
========================= */

async function saveMatch() {

  if (!auth.currentUser) {

    connection.textContent =
      "🔴 NOT LOGGED IN";

    return false;
  }

  const matchData = {

    homeScore: homeScore,

    awayScore: awayScore,

    timerSeconds: timerSeconds,

    timerRunning: timerRunning,

    status: statusDisplay.textContent,

    alert: alertDisplay.textContent,

    updatedAt: Date.now()

  };

  try {

    await set(matchRef, matchData);

    connection.textContent =
      "🟢 FIREBASE CONNECTED";

    return true;

  } catch (error) {

    console.error("Firebase write error:", error);

    connection.textContent =
      "🔴 FIREBASE WRITE ERROR";

    return false;

  }

}


/* =========================
   LOGIN
========================= */

document
.getElementById("loginBtn")
.addEventListener("click", async () => {

  const email =
    document.getElementById("email")
    .value
    .trim();

  const password =
    document.getElementById("password")
    .value;

  if (!email || !password) {

    loginError.textContent =
      "❌ Enter your email and password.";

    return;
  }

  loginError.textContent =
    "Logging in...";

  try {

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

    loginError.textContent = "";

  } catch (error) {

    console.error(error);

    loginError.textContent =
      "❌ Login failed. Check your email and password.";

  }

});


/* =========================
   AUTH STATE
========================= */

onAuthStateChanged(auth, (user) => {

  if (user) {

    loginScreen.classList.add("hidden");

    controlPanel.classList.remove("hidden");

    connection.textContent =
      "🟢 AUTHENTICATED — FIREBASE CONNECTED";

    startLocalTimer();

  } else {

    loginScreen.classList.remove("hidden");

    controlPanel.classList.add("hidden");

    stopLocalTimer();

  }

});


/* =========================
   FIREBASE LISTENER
========================= */

onValue(
  matchRef,
  (snapshot) => {

    const data =
      snapshot.val();

    if (!data) {

      connection.textContent =
        "🟢 FIREBASE CONNECTED";

      return;
    }

    /*
      Firebase is used to load the
      current match state.

      It does NOT save every second.
    */

    homeScore =
      Number(data.homeScore || 0);

    awayScore =
      Number(data.awayScore || 0);

    /*
      Only take Firebase timer when
      the local timer is stopped.
    */

    if (!timerRunning) {

      timerSeconds =
        Number(data.timerSeconds || 0);

      updateTimer();

    }

    homeScoreDisplay.textContent =
      homeScore;

    awayScoreDisplay.textContent =
      awayScore;

    statusDisplay.textContent =
      data.status ||
      "🟢 MATCH NOT STARTED";

    alertDisplay.textContent =
      data.alert ||
      "🎛️ Control panel ready.";

    connection.textContent =
      "🟢 LIVE DATABASE CONNECTED";

  },

  (error) => {

    console.error(error);

    connection.textContent =
      "🔴 DATABASE CONNECTION ERROR";

  }
);


/* =========================
   START MATCH
========================= */

document
.getElementById("startBtn")
.addEventListener("click", async () => {

  homeScore = 0;

  awayScore = 0;

  timerSeconds = 0;

  timerRunning = true;

  homeScoreDisplay.textContent = "0";

  awayScoreDisplay.textContent = "0";

  statusDisplay.textContent =
    "🔴 MATCH LIVE";

  alertDisplay.textContent =
    "🔔 MATCH STARTED! The game is LIVE.";

  updateTimer();

  startLocalTimer();

  await saveMatch();

});


/* =========================
   HOME GOAL
========================= */

document
.getElementById("homeGoalBtn")
.addEventListener("click", async () => {

  if (!timerRunning) {

    alertDisplay.textContent =
      "⚠️ Start the match first.";

    return;
  }

  homeScore++;

  homeScoreDisplay.textContent =
    homeScore;

  alertDisplay.textContent =
    "⚽ GOAL! ND1 + HND1 have scored!";

  /*
    Firebase receives the new score
    only once.
  */

  await saveMatch();

});


/* =========================
   AWAY GOAL
========================= */

document
.getElementById("awayGoalBtn")
.addEventListener("click", async () => {

  if (!timerRunning) {

    alertDisplay.textContent =
      "⚠️ Start the match first.";

    return;
  }

  awayScore++;

  awayScoreDisplay.textContent =
    awayScore;

  alertDisplay.textContent =
    "⚽ GOAL! ND2 + HND2 have scored!";

  await saveMatch();

});


/* =========================
   HALF TIME
========================= */

document
.getElementById("halfBtn")
.addEventListener("click", async () => {

  timerRunning = false;

  statusDisplay.textContent =
    "⏸️ HALF TIME";

  alertDisplay.textContent =
    "⏸️ HALF TIME — Score: " +
    homeScore +
    " — " +
    awayScore;

  await saveMatch();

});


/* =========================
   RESUME
========================= */

document
.getElementById("resumeBtn")
.addEventListener("click", async () => {

  timerRunning = true;

  statusDisplay.textContent =
    "🔴 MATCH LIVE";

  alertDisplay.textContent =
    "▶️ MATCH RESUMED! The game is LIVE.";

  startLocalTimer();

  await saveMatch();

});


/* =========================
   FULL TIME
========================= */

document
.getElementById("fullBtn")
.addEventListener("click", async () => {

  timerRunning = false;

  statusDisplay.textContent =
    "🏁 FULL TIME";

  alertDisplay.textContent =
    "🏆 FULL TIME — Final Score: " +
    homeScore +
    " — " +
    awayScore;

  await saveMatch();

});


/* =========================
   RESET
========================= */

document
.getElementById("resetBtn")
.addEventListener("click", async () => {

  timerRunning = false;

  timerSeconds = 0;

  homeScore = 0;

  awayScore = 0;

  homeScoreDisplay.textContent =
    "0";

  awayScoreDisplay.textContent =
    "0";

  statusDisplay.textContent =
    "🟢 MATCH NOT STARTED";

  alertDisplay.textContent =
    "🎛️ Control panel ready.";

  updateTimer();

  await saveMatch();

});


/* =========================
   LOGOUT
========================= */

document
.getElementById("logoutBtn")
.addEventListener("click", async () => {

  await signOut(auth);

});


/* =========================
   INITIAL
========================= */

updateTimer();

startLocalTimer();

</script>

</body>
  </html>
